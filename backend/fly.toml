# Fly.io config for the backend.
# Run `fly launch --no-deploy --copy-config` once, then `fly secrets set ...`
# to upload GEMINI_API_KEY, ANTHROPIC_API_KEY, FRONTEND_ORIGIN.

app = "master-annotator-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Extraction of a 12-page paper can take ~90s at concurrency=6. Bump the
  # idle timeout so Fly's proxy doesn't kill the request mid-stream.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 30
    soft_limit = 20

# Memory: PyMuPDF + 6 concurrent Gemini calls easily fit in 1 GiB.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
